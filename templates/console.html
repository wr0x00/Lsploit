<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版CMD终端 - 命令输入版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
        }
        
        .terminal-container {
            max-width: 1000px;
            margin: 0 auto;
            border: 1px solid #333;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }
        
        .terminal-header {
            background: #2d2d2d;
            padding: 10px 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .terminal-controls {
            display: flex;
            gap: 8px;
        }
        
        .control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27ca3f; }
        
        .terminal-title {
            font-size: 14px;
            color: #ccc;
        }
        
        .terminal-body {
            background: #000;
            height: 400px;
            overflow: auto;
            padding: 15px;
            position: relative;
        }
        
        .log-content {
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.4;
            font-size: 14px;
            min-height: 100%;
        }
        
        .log-line {
            margin-bottom: 2px;
        }
        
        .timestamp {
            color: #666;
            margin-right: 10px;
        }
        
        .command-input-area {
            background: #000;
            border-top: 1px solid #333;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }
        
        .prompt {
            color: #00ff00;
            margin-right: 8px;
            white-space: nowrap;
        }
        
        .command-input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #00ff00;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .status-bar {
            background: #2d2d2d;
            padding: 8px 15px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
        }
        
        .controls {
            margin-bottom: 15px;
            text-align: center;
        }
        
        .btn {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        .btn:hover {
            background: #00ff00;
            color: #000;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .command-history {
            color: #aaa;
        }
        
        .command-output {
            color: #00ff00;
        }
        
        .command-error {
            color: #ff5555;
        }
        
        /* ANSI 颜色样式 */
        .ansi-bold { font-weight: bold; }
        .ansi-italic { font-style: italic; }
        .ansi-underline { text-decoration: underline; }
        
        /* 前景色 */
        .ansi-fg-black { color: #000; }
        .ansi-fg-red { color: #ff5555; }
        .ansi-fg-green { color: #00ff00; }
        .ansi-fg-yellow { color: #ffff55; }
        .ansi-fg-blue { color: #5555ff; }
        .ansi-fg-magenta { color: #ff55ff; }
        .ansi-fg-cyan { color: #55ffff; }
        .ansi-fg-white { color: #fff; }
        .ansi-fg-bright-black { color: #555; }
        .ansi-fg-bright-red { color: #ff5555; }
        .ansi-fg-bright-green { color: #55ff55; }
        .ansi-fg-bright-yellow { color: #ffff55; }
        .ansi-fg-bright-blue { color: #5555ff; }
        .ansi-fg-bright-magenta { color: #ff55ff; }
        .ansi-fg-bright-cyan { color: #55ffff; }
        .ansi-fg-bright-white { color: #fff; }
        
        /* 背景色 */
        .ansi-bg-black { background-color: #000; }
        .ansi-bg-red { background-color: #ff5555; }
        .ansi-bg-green { background-color: #00ff00; }
        .ansi-bg-yellow { background-color: #ffff55; }
        .ansi-bg-blue { background-color: #5555ff; }
        .ansi-bg-magenta { background-color: #ff55ff; }
        .ansi-bg-cyan { background-color: #55ffff; }
        .ansi-bg-white { background-color: #fff; }
        .ansi-bg-bright-black { background-color: #555; }
        .ansi-bg-bright-red { background-color: #ff5555; }
        .ansi-bg-bright-green { background-color: #55ff55; }
        .ansi-bg-bright-yellow { background-color: #ffff55; }
        .ansi-bg-bright-blue { background-color: #5555ff; }
        .ansi-bg-bright-magenta { background-color: #ff55ff; }
        .ansi-bg-bright-cyan { background-color: #55ffff; }
        .ansi-bg-bright-white { background-color: #fff; }
        
        /* 滚动条样式 */
        .terminal-body::-webkit-scrollbar {
            width: 8px;
        }
        
        .terminal-body::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        .terminal-body::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }
        
        .auto-scroll-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 255, 0, 0.8);
            color: #000;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="controls">
            <button @click="startPolling" :disabled="isPolling" class="btn">开始接收</button>
            <button @click="stopPolling" :disabled="!isPolling" class="btn">停止接收</button>
            <button @click="clearLogs" class="btn">清空日志</button>
            <button @click="toggleAutoScroll" class="btn">
                {% if autoScroll %}
                关闭自动滚动
                {% else %}
                开启自动滚动
                {% endif %}
            </button>
        </div>
        
        <div class="terminal-container">
            <div class="terminal-header">
                <div class="terminal-controls">
                    <div class="control close"></div>
                    <div class="control minimize"></div>
                    <div class="control maximize"></div>
                </div>
                <div class="terminal-title">网页版CMD终端 - 命令输入模式</div>
                <div></div>
            </div>
            <div class="terminal-body" ref="terminalBody" @scroll="checkAutoScroll">
                <div class="log-content" ref="logContent">
                    <div v-for="(log, index) in logs" :key="index" class="log-line">
                        <style>
                        span {
                        display: inline-block;
                        width: 100px; /* 可根据需要调整宽度 */
                        word-break: break-word;
                        }
                        </style>
                        <span class="timestamp">[{{ log.timestamp }}]</span>
                        <span :class="log.type" v-html="log.content"></span>
                    </div>
                </div>
                <div class="auto-scroll-indicator" v-show="showAutoScrollIndicator">自动滚动中</div>
            </div>
            
            <div class="command-input-area">
                <span class="prompt">Lsploit》</span>
                <input 
                    type="text" 
                    class="command-input" 
                    v-model="currentCommand" 
                    @keydown.enter="executeCommand"
                    @keydown.up="navigateHistory(-1)"
                    @keydown.down="navigateHistory(1)"
                    placeholder="输入命令并按回车执行"
                    ref="commandInput"
                >
                <span class="cursor" v-show="!isCommandExecuting"></span>
                <span v-show="isCommandExecuting" style="color: #ffff55;">执行中...</span>
            </div>
            
            <div class="status-bar">
                <div>行数: {{ logs.length }} | 最后更新: {{ lastUpdateTime }}</div>
                <div>状态: 
                    {% if isCommandExecuting %}
                    命令执行中...
                    {% else %}
                        {% if isPolling%}
                        监控中...
                        {% else %}
                        '就绪'
                        {% endif %}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, onUnmounted, nextTick } = Vue;
        
        createApp({
            setup() {
                const logs = ref([]);
                const isPolling = ref(false);
                const autoScroll = ref(true);
                const showAutoScrollIndicator = ref(false);
                const lastUpdateTime = ref('');
                const terminalBody = ref(null);
                const logContent = ref(null);
                const commandInput = ref(null);
                const pollInterval = ref(null);
                
                const currentCommand = ref('');
                const commandHistory = ref([]);
                const historyIndex = ref(-1);
                const isCommandExecuting = ref(false);
                const maxLogLines = 1000;
                
                // ANSI颜色码解析器
                const parseAnsiColors = (text) => {
                    if (!text) return text;
                    
                    // ANSI转义序列正则表达式
                    const ansiRegex = /\x1b\[([0-9;]*)m/g;
                    let lastIndex = 0;
                    let result = '';
                    let match;
                    let currentClasses = [];
                    
                    while ((match = ansiRegex.exec(text)) !== null) {
                        // 添加之前的文本
                        if (match.index > lastIndex) {
                            const plainText = text.substring(lastIndex, match.index);
                            if (currentClasses.length > 0) {
                                result += `<span class="${currentClasses.join(' ')}">${plainText}</span>`;
                            } else {
                                result += plainText;
                            }
                        }
                        
                        // 处理ANSI代码
                        const codes = match[1].split(';').map(Number);
                        let newClasses = [];
                        
                        for (let i = 0; i < codes.length; i++) {
                            const code = codes[i];
                            
                            switch (code) {
                                case 0: // 重置
                                    newClasses = [];
                                    break;
                                case 1: // 粗体
                                    newClasses.push('ansi-bold');
                                    break;
                                case 3: // 斜体
                                    newClasses.push('ansi-italic');
                                    break;
                                case 4: // 下划线
                                    newClasses.push('ansi-underline');
                                    break;
                                // 前景色
                                case 30: newClasses.push('ansi-fg-black'); break;
                                case 31: newClasses.push('ansi-fg-red'); break;
                                case 32: newClasses.push('ansi-fg-green'); break;
                                case 33: newClasses.push('ansi-fg-yellow'); break;
                                case 34: newClasses.push('ansi-fg-blue'); break;
                                case 35: newClasses.push('ansi-fg-magenta'); break;
                                case 36: newClasses.push('ansi-fg-cyan'); break;
                                case 37: newClasses.push('ansi-fg-white'); break;
                                // 亮色前景色
                                case 90: newClasses.push('ansi-fg-bright-black'); break;
                                case 91: newClasses.push('ansi-fg-bright-red'); break;
                                case 92: newClasses.push('ansi-fg-bright-green'); break;
                                case 93: newClasses.push('ansi-fg-bright-yellow'); break;
                                case 94: newClasses.push('ansi-fg-bright-blue'); break;
                                case 95: newClasses.push('ansi-fg-bright-magenta'); break;
                                case 96: newClasses.push('ansi-fg-bright-cyan'); break;
                                case 97: newClasses.push('ansi-fg-bright-white'); break;
                                // 背景色
                                case 40: newClasses.push('ansi-bg-black'); break;
                                case 41: newClasses.push('ansi-bg-red'); break;
                                case 42: newClasses.push('ansi-bg-green'); break;
                                case 43: newClasses.push('ansi-bg-yellow'); break;
                                case 44: newClasses.push('ansi-bg-blue'); break;
                                case 45: newClasses.push('ansi-bg-magenta'); break;
                                case 46: newClasses.push('ansi-bg-cyan'); break;
                                case 47: newClasses.push('ansi-bg-white'); break;
                                // 亮色背景色
                                case 100: newClasses.push('ansi-bg-bright-black'); break;
                                case 101: newClasses.push('ansi-bg-bright-red'); break;
                                case 102: newClasses.push('ansi-bg-bright-green'); break;
                                case 103: newClasses.push('ansi-bg-bright-yellow'); break;
                                case 104: newClasses.push('ansi-bg-bright-blue'); break;
                                case 105: newClasses.push('ansi-bg-bright-magenta'); break;
                                case 106: newClasses.push('ansi-bg-bright-cyan'); break;
                                case 107: newClasses.push('ansi-bg-bright-white'); break;
                            }
                        }
                        
                        currentClasses = newClasses;
                        lastIndex = match.index + match[0].length;
                    }
                    
                    // 添加剩余文本
                    if (lastIndex < text.length) {
                        const remainingText = text.substring(lastIndex);
                        if (currentClasses.length > 0) {
                            result += `<span class="${currentClasses.join(' ')}">${remainingText}</span>`;
                        } else {
                            result += remainingText;
                        }
                    }
                    
                    return result;
                };
                
                // 获取当前时间戳
                const getCurrentTime = () => {
                    const now = new Date();
                    return now.toTimeString().split(' ')[0];
                };
                
                // 添加日志
                const addLog = (content, type = 'command-output') => {
                    const timestamp = getCurrentTime();
                    
                    // 处理换行符和颜色符
                    let processedContent = content;
                    
                    // 解析ANSI颜色码
                    processedContent = parseAnsiColors(processedContent);
                    
                    // 处理换行符和空格
                    processedContent = processedContent
                        .replace(/\n/g, '<br>')
                        .replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
                        .replace(/ /g, '&nbsp;');
                    
                    logs.value.push({
                        timestamp,
                        content: processedContent,
                        type
                    });
                    
                    // 限制日志行数
                    if (logs.value.length > maxLogLines) {
                        logs.value = logs.value.slice(-maxLogLines);
                    }
                    
                    lastUpdateTime.value = timestamp;
                    
                    // 自动滚动到底部
                    if (autoScroll.value) {
                        nextTick(() => {
                            scrollToBottom();
                        });
                    }
                };
                
                // 滚动到底部
                const scrollToBottom = () => {
                    if (terminalBody.value) {
                        terminalBody.value.scrollTop = terminalBody.value.scrollHeight;
                    }
                };
                
                // 检查是否启用自动滚动
                const checkAutoScroll = () => {
                    if (!terminalBody.value) return;
                    
                    const { scrollTop, scrollHeight, clientHeight } = terminalBody.value;
                    const atBottom = scrollHeight - scrollTop - clientHeight < 10;
                    
                    if (!atBottom && autoScroll.value) {
                        autoScroll.value = false;
                        showAutoScrollIndicator.value = false;
                    }
                };
                
                // 切换自动滚动
                const toggleAutoScroll = () => {
                    autoScroll.value = !autoScroll.value;
                    if (autoScroll.value) {
                        scrollToBottom();
                        showAutoScrollIndicator.value = true;
                        setTimeout(() => {
                            showAutoScrollIndicator.value = false;
                        }, 2000);
                    }
                };

                // 执行命令
                const executeCommand = async () => {
                    const command = currentCommand.value.trim();
                    if (!command) return;
                    
                    // 添加到命令历史
                    commandHistory.value.push(command);
                    historyIndex.value = commandHistory.value.length;
                    
                    // 显示输入的命令
                    addLog(`$ ${command}`, 'command-history');
                    
                    isCommandExecuting.value = true;
                    currentCommand.value = '';
                    
                    try {
                        // 发送命令到后端API
                        const response = await axios.post('/console_do/', {
                            command: command
                        }, {
                            timeout: 30000 // 30秒超时
                        });
                        
                        // 显示命令输出
                        if (response.data) {
                            addLog(response.data, 'command-output');
                        } else {
                            addLog('命令执行完成，但无输出', 'command-output');
                        }
                    } catch (error) {
                        let errorMessage = '命令执行失败: ';
                        
                        if (error.response) {
                            // 服务器返回了错误状态码
                            errorMessage += `服务器错误 (${error.response.status})`;
                            if (error.response.data && error.response.data.error) {
                                errorMessage += `: ${error.response.data.error}`;
                            }
                        } else if (error.request) {
                            // 请求已发出但没有收到响应
                            errorMessage += '无法连接到服务器';
                        } else {
                            // 其他错误
                            errorMessage += error.message;
                        }
                        
                        addLog(errorMessage, 'command-error');
                    } finally {
                        isCommandExecuting.value = false;
                        // 重新聚焦到输入框
                        nextTick(() => {
                            if (commandInput.value) {
                                commandInput.value.focus();
                            }
                        });
                    }
                };
                
                // 命令历史导航
                const navigateHistory = (direction) => {
                    if (commandHistory.value.length === 0) return;
                    
                    historyIndex.value += direction;
                    
                    if (historyIndex.value < 0) {
                        historyIndex.value = 0;
                    } else if (historyIndex.value >= commandHistory.value.length) {
                        historyIndex.value = commandHistory.value.length;
                        currentCommand.value = '';
                    } else {
                        currentCommand.value = commandHistory.value[historyIndex.value];
                    }
                };
                
                // 模拟GET请求获取数据（原有的日志监控功能）
                const fetchLogData = async () => {
                    try {
                        const response = await fetch('https://jsonplaceholder.typicode.com/posts/' + (Math.floor(Math.random() * 100) + 1));
                        const data = await response.json();
                        
                        const logMessage = `INFO: 接收到数据 - ID: ${data.id}, 标题: ${data.title.substring(0, 30)}...`;
                        addLog(logMessage, 'system-info');
                        
                    } catch (error) {
                        const errorMessage = `ERROR: 获取数据失败 - ${error.message}`;
                        addLog(errorMessage, 'system-error');
                    }
                };
                
                // 开始轮询
                const startPolling = () => {
                    if (isPolling.value) return;
                    
                    isPolling.value = true;
                    addLog('=== 开始监控系统日志 ===', 'system-info');
                    
                    // 立即获取一次数据
                    fetchLogData();
                    
                    // 设置定时器，每3秒获取一次数据
                    pollInterval.value = setInterval(() => {
                        fetchLogData();
                    }, 3000);
                };
                
                // 停止轮询
                const stopPolling = () => {
                    if (pollInterval.value) {
                        clearInterval(pollInterval.value);
                        pollInterval.value = null;
                    }
                    isPolling.value = false;
                    addLog('=== 停止监控系统日志 ===', 'system-info');
                };
                
                // 清空日志
                const clearLogs = () => {
                    logs.value = [];
                    addLog('日志已清空', 'system-info');
                };
                
                onMounted(() => {
                    addLog('网页版Lsploit终端已启动 - 输入命令并按回车执行', 'system-info');
                    /*
                    try {
                        // 发送命令到后端API
                        const response = await axios.post('/console_start/', {
                        }, {
                            timeout: 30000 // 30秒超时
                        });
                        
                        // 显示命令输出
                        if (response.data) {
                            addLog(response.data, 'command-output');
                        } else {
                            addLog('命令执行完成，但无输出', 'command-output');
                        }
                    } catch (error) {
                        let errorMessage = '命令执行失败: ';
                        
                        if (error.response) {
                            // 服务器返回了错误状态码
                            errorMessage += `服务器错误 (${error.response.status})`;
                            if (error.response.data && error.response.data.error) {
                                errorMessage += `: ${error.response.data.error}`;
                            }
                        } else if (error.request) {
                            // 请求已发出但没有收到响应
                            errorMessage += '无法连接到服务器';
                        } else {
                            // 其他错误
                            errorMessage += error.message;
                        }
                        
                        addLog(errorMessage, 'command-error');
                    } finally {
                        //isCommandExecuting.value = false;
                        // 重新聚焦到输入框
                        nextTick(() => {
                            if (commandInput.value) {
                                commandInput.value.focus();
                            }
                        });
                    }*/
                    addLog(start_info)

                    //addLog('示例命令: help, dir, ls, ping, status', 'system-info');
                    
                    /* 测试ANSI颜色码显示
                    addLog('ANSI颜色测试:', 'system-info');
                    addLog('\x1b[31m红色文本\x1b[0m', 'command-output');
                    addLog('\x1b[32m绿色文本\x1b[0m', 'command-output');
                    addLog('\x1b[33m黄色文本\x1b[0m', 'command-output');
                    addLog('\x1b[34m蓝色文本\x1b[0m', 'command-output');
                    addLog('\x1b[35m洋红色文本\x1b[0m', 'command-output');
                    addLog('\x1b[36m青色文本\x1b[0m', 'command-output');
                    addLog('\x1b[1;31m粗体红色文本\x1b[0m', 'command-output');
                    addLog('\x1b[4;32m下划线绿色文本\x1b[0m', 'command-output');
                    addLog('\x1b[41;37m白字红底文本\x1b[0m', 'command-output');
                    */
                    
                    // 自动聚焦到输入框
                    if (commandInput.value) {
                        commandInput.value.focus();
                    }
                });
                
                onUnmounted(() => {
                    if (pollInterval.value) {
                        clearInterval(pollInterval.value);
                    }
                });
                
                return {
                    logs,
                    isPolling,
                    autoScroll,
                    showAutoScrollIndicator,
                    lastUpdateTime,
                    terminalBody,
                    logContent,
                    commandInput,
                    currentCommand,
                    isCommandExecuting,
                    startPolling,
                    stopPolling,
                    clearLogs,
                    toggleAutoScroll,
                    checkAutoScroll,
                    executeCommand,
                    navigateHistory
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
